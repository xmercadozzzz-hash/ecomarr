<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECOMAR</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #006994,
                #00a896
            );

            font-family: Arial, sans-serif;
        }

        .contenedor {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 50px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .icono {
            font-size: 70px;
            color: #006994;
            margin-bottom: 20px;
        }

        h1 {
            color: #123c4a;
            font-weight: bold;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .btn-volver {
            background: #006994;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn-volver:hover {
            background: #004f70;
            color: white;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="icono">
            <i class="bi bi-tools"></i>
        </div>

        <h1>Sección en desarrollo</h1>

        <p>
            Esta sección de ECOMAR está siendo desarrollada.
            Pronto podrás encontrar aquí nuevas funcionalidades
            para apoyar la protección de nuestros océanos.
        </p>

        <a href="/" class="btn-volver">
            <i class="bi bi-arrow-left"></i>
            Volver al inicio
        </a>

    </div>

</body>

</html>
